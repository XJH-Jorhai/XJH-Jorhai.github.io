<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TEISU · 开幕原型（本地）</title>
<style>
  :root {--navy:#083366;--red:#EF3025;--paper:#F3EDE2;--ink:#1D2733;}
  * {box-sizing:border-box;}
  html,body {margin:0;background:#04060b;color:var(--ink);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;}
  html.locked,html.locked body {overflow:hidden;}
  /* The stage: one 2D canvas. Fixed during the opening, then it lies over the hero for the lens. */
  #stage {position:fixed;inset:0;width:100vw;height:100vh;z-index:10;display:block;cursor:pointer;}
  #stage.is-landed {position:absolute;cursor:default;pointer-events:none;}
  /* ---------- Hero (same composition the mosaic resolves into) ---------- */
  .hero {position:relative;height:100vh;min-height:520px;overflow:hidden;background:#F13D18;}
  .field {position:absolute;top:0;bottom:0;width:51%;}
  .field.l {left:0;background:linear-gradient(180deg,#1645AC 0%,#2747A6 55%,#5E5797 100%);}
  .field.r {right:0;background:linear-gradient(180deg,#F13D18 0%,#F4441C 60%,#F54719 100%);}
  .art {position:absolute;inset:0;margin:0 auto;height:100%;aspect-ratio:1;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);}
  .art img {width:100%;height:100%;object-fit:cover;display:block;}
  .word {position:absolute;left:clamp(20px,3.4vw,56px);bottom:clamp(24px,5vh,56px);width:clamp(260px,46vh,440px);transform-origin:0 100%;transform:rotate(-90deg) translateY(100%);margin:0;}
  .word svg {display:block;width:100%;height:auto;overflow:visible;}
  .side {position:absolute;right:clamp(20px,3.4vw,56px);top:50%;translate:0 -50%;writing-mode:vertical-rl;display:flex;gap:28px;font:500 12px/1 system-ui,sans-serif;letter-spacing:.42em;color:#FFF3E6;margin:0;}
  .cap {position:absolute;right:clamp(20px,3.4vw,56px);bottom:clamp(24px,5vh,48px);display:grid;justify-items:end;gap:8px;text-align:right;font-size:14px;letter-spacing:.14em;color:#FFF3E6;margin:0;}
  .cap span:first-child {font:11px ui-monospace,Consolas,monospace;letter-spacing:.2em;background:var(--navy);padding:4px 10px;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);}
  .hero [data-in] {opacity:0;transform:translateY(18px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1.2s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s);}
  .hero .side[data-in] {transform:translate(0,18px);}
  .hero.is-open [data-in] {opacity:1;transform:none;}
  .word .l {transform-box:fill-box;transition:transform 1.1s cubic-bezier(.16,1,.3,1);}
  .word :is(.l-T,.l-I,.l-S,.l-U) {transform:translateY(110%);}
  .word .l-E {transform-origin:0 50%;transform:scaleX(0);transition-duration:.9s;}
  .word .l-T {transition-delay:.15s;} .word .l-E1 {transition-delay:.23s;} .word .l-E3 {transition-delay:.3s;} .word .l-I {transition-delay:.31s;} .word .l-S {transition-delay:.39s;} .word .l-U {transition-delay:.47s;} .word .l-E2 {transition-delay:.6s;}
  .hero.is-open .word .l {transform:none;}
  @media (max-aspect-ratio:1/1) {
    .art {inset:0 0 auto 0;width:100%;height:auto;-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,#000 80%,transparent 100%);}
    .field.l,.field.r {width:100%;} .field.l {background:linear-gradient(180deg,#1645AC,#2D4BA8);} .field.r {top:auto;height:50%;background:linear-gradient(180deg,#2D4BA8,#5B5596);}
    .word {transform:none;left:20px;right:20px;bottom:130px;width:auto;}
    .side {writing-mode:horizontal-tb;top:auto;right:auto;left:20px;bottom:90px;translate:none;gap:18px;letter-spacing:.3em;}
    .cap {left:20px;right:20px;justify-items:start;text-align:left;bottom:28px;}
  }
  .below {min-height:60vh;background:var(--paper);display:grid;place-items:center;font:13px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:#615F58;text-align:center;padding:40px;}
  /* ---------- Lab controls (prototype only) ---------- */
  .lab {position:fixed;left:12px;bottom:12px;z-index:20;display:flex;align-items:center;gap:6px;padding:6px;border-radius:8px;background:rgb(20 24 34 / .82);color:#E9E3D6;font:12px/1 system-ui,sans-serif;backdrop-filter:blur(8px);}
  .lab button {font:inherit;color:inherit;background:rgb(255 255 255 / .08);border:1px solid rgb(255 255 255 / .16);border-radius:6px;padding:7px 10px;cursor:pointer;}
  .lab button:hover {background:rgb(255 255 255 / .16);}
  .lab output {min-width:140px;padding:0 8px;font-family:ui-monospace,Consolas,monospace;opacity:.8;}
  .lab.hidden {opacity:0;pointer-events:none;}
</style>
</head>
<body>
<canvas id="stage" aria-label="TEISU 开幕：向下滚动解锁，或点击"></canvas>

<section class="hero" id="hero">
  <div class="field l"></div><div class="field r"></div>
  <figure class="art" style="margin:0"><img id="painting" src="__PAINTING__" width="1254" height="1254" alt="油画风格的人物插画" /></figure>
  <h1 class="word"><svg viewBox="190 1250 1620 384" aria-label="TEISU">__WORDMARK__</svg></h1>
  <p class="side" data-in style="--d:.5s"><span>FIELDNOTES</span><span>研究 · 制作 · 观察</span></p>
  <p class="cap" data-in style="--d:.65s"><span>人物设定</span><span>把想法做成实物，也把过程留在这里。</span></p>
</section>
<section class="below">（原型只包含开幕与首页首屏；以下作品、笔记等部分在正式站点中）</section>

<div class="lab" id="lab">
  <button type="button" id="replay" title="R">↺ 重播</button>
  <button type="button" id="skip" title="S">⇥ 跳到开幕</button>
  <button type="button" id="land" title="L">⤓ 直接落地</button>
  <output id="readout">—</output>
  <button type="button" id="hide" title="H">隐藏</button>
</div>

<script>
const BRAND = __BRAND__;
/* ===================================================================================
   TEISU opening — prototype.
   A  Scroll progress p (0→1): only the centre core at first (red blades + white key);
      the white arms grow, copies spread from the centre and tile the screen.
      At 30 / 60 / 90 % every tile turns a quarter, rippling outward (a combination lock).
   B  At 100 %: the film runs backwards to the centre core; the arms grow again, but now
      the copies are a fractal — each logo splits into four smaller ones, again and again.
      The smallest tiles take the painting's colours, the gaps fill in, and the mosaic
      becomes the home hero. Afterwards a lens near the pointer turns the painting back
      into TEISU tiles.
   =================================================================================== */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const hero = document.getElementById('hero');
const painting = document.getElementById('painting');
const readout = document.getElementById('readout');
const root = document.documentElement;

const INK = '#ECE6D8', RED = '#EF3025';
const ARMS = ['tl','br','tr','bl'], CORE = ['ru','rl','c'];
const P = Object.fromEntries(Object.entries(BRAND.pieces).map(([k,d]) => [k, new Path2D(d)]));

const clamp = v => Math.min(1, Math.max(0, v));
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,t) => a + (b-a)*t;
const inOutCubic = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const outCubic = t => 1-Math.pow(1-t,3);
const outExpo = t => t>=1 ? 1 : 1-Math.pow(2,-10*t);
const outBack = t => {const c=1.7; return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

let W=0, H=0, dpr=1;
const layer = document.createElement('canvas'), lctx = layer.getContext('2d');   // tiles, before colouring
const comp = document.createElement('canvas'), cctx = comp.getContext('2d');     // the hero composition
const sprite = document.createElement('canvas'), sctx = sprite.getContext('2d'); // one logo, for small tiles

function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  for (const c of [canvas, layer, comp]) { c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); }
  buildComp(); buildGrid(); buildFractal();
}
/** Paint the hero exactly as the DOM lays it out, so the mosaic resolves into it. */
function buildComp(){
  const c = cctx; c.setTransform(dpr,0,0,dpr,0,0);
  const portrait = W/H < 1;
  if (!portrait) {
    let g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1645AC'); g.addColorStop(.55,'#2747A6'); g.addColorStop(1,'#5E5797');
    c.fillStyle = g; c.fillRect(0,0,W/2+1,H);
    g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#F13D18'); g.addColorStop(.6,'#F4441C'); g.addColorStop(1,'#F54719');
    c.fillStyle = g; c.fillRect(W/2,0,W/2,H);
    const s = H, x = (W-s)/2;
    if (painting.complete && painting.naturalWidth) {
      // edges fade into the fields like the CSS mask
      const tmp = document.createElement('canvas'); tmp.width = Math.round(s*dpr); tmp.height = Math.round(s*dpr);
      const t = tmp.getContext('2d'); t.drawImage(painting,0,0,tmp.width,tmp.height);
      t.globalCompositeOperation = 'destination-in';
      const m = t.createLinearGradient(0,0,tmp.width,0); m.addColorStop(0,'rgba(0,0,0,0)'); m.addColorStop(.09,'#000'); m.addColorStop(.91,'#000'); m.addColorStop(1,'rgba(0,0,0,0)');
      t.fillStyle = m; t.fillRect(0,0,tmp.width,tmp.height);
      c.drawImage(tmp,x,0,s,s);
    }
  } else {
    let g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1645AC'); g.addColorStop(.5,'#2D4BA8'); g.addColorStop(1,'#5B5596');
    c.fillStyle = g; c.fillRect(0,0,W,H);
    if (painting.complete && painting.naturalWidth) c.drawImage(painting,0,0,W,W);
  }
}
function buildSprite(size){
  sprite.width = sprite.height = size; sctx.clearRect(0,0,size,size);
  sctx.setTransform(size/720,0,0,size/720,0,0);
  for (const k of ARMS) { sctx.fillStyle = INK; sctx.fill(P[k]); }
  sctx.fillStyle = RED; sctx.fill(P.ru); sctx.fill(P.rl); sctx.fillStyle = INK; sctx.fill(P.c);
}

/* ---------- drawing one logo with Path2D (large tiles) ---------- */
function drawLogo(c, cx, cy, size, rot, arms, core, alpha=1){
  if (alpha <= 0 || size <= 0) return;
  c.save(); c.globalAlpha = alpha; c.translate(cx,cy); c.rotate(rot*Math.PI/180); c.scale(size/720,size/720);
  if (core > 0) {
    c.save(); c.scale(core,core); c.translate(-360,-360);
    c.fillStyle = RED; c.fill(P.ru); c.fill(P.rl); c.fillStyle = INK; c.fill(P.c); c.restore();
  }
  if (arms > 0) {
    c.save(); c.rotate((1-arms)*-0.9); c.scale(arms,arms); c.translate(-360,-360);
    c.fillStyle = INK; for (const k of ARMS) c.fill(P[k]); c.restore();
  }
  c.restore();
}

/* ================= A: the tiling, driven by scroll ================= */
let grid = [], T = 120;
function buildGrid(){
  T = Math.max(84, Math.min(190, Math.min(W,H)*.2)); const pitch = T*1.22;
  const nx = Math.ceil(W/2/pitch)+1, ny = Math.ceil(H/2/pitch)+1, maxD = Math.hypot(nx,ny);
  grid = [];
  for (let j=-ny;j<=ny;j++) for (let i=-nx;i<=nx;i++) grid.push({x:W/2+i*pitch, y:H/2+j*pitch, d:Math.hypot(i,j)/maxD, ring:Math.max(Math.abs(i),Math.abs(j))});
  grid.sort((a,b)=>a.d-b.d);
}
const CLICKS = [.3,.6,.9];
let clickEvents = [];            // {time, dir}
let passed = 0;
function tileTurn(now, d){
  let r = 0;
  for (const e of clickEvents) r += e.dir*90*outBack(seg(now - e.time - d*.32, 0, .55));
  return r;
}
function drawTiling(p, now, reverse=null){
  for (const g of grid) {
    const isCentre = g.d === 0;
    // centre: core from the start, arms over the first 15 %; copies sweep out between 8 % and 85 %
    const a = isCentre ? 1 : clamp((p - .08 - g.d*.62)/.16);
    const arms = isCentre ? outCubic(seg(p,0,.15)) : outExpo(seg(a,.35,1));
    const core = isCentre ? 1 : outExpo(seg(a,0,.6));
    const turn = reverse ? reverse.turn : tileTurn(now, g.d);
    if (core > 0) drawLogo(ctx, g.x, g.y, T, turn, arms, core, isCentre ? 1 : Math.min(1, a*2));
  }
}

/* ================= B: reverse, fractal, colour, land ================= */
let cells = [], S0 = 0, DEPTH = 6;
const SPLIT = [.5,.42,.36,.31,.27,.24];
function buildFractal(){
  S0 = Math.max(W,H); DEPTH = Math.max(4, Math.min(6, Math.ceil(Math.log2(S0/22))));
  // every cell at every depth, with its parent; only cells that touch the screen
  cells = [];
  const rec = (x,y,s,depth,parent,q) => {
    const cell = {x,y,s,depth,parent,q}; cells.push(cell);
    if (depth >= DEPTH) return;
    const h = s/2;
    [[-1,-1,0],[1,-1,1],[-1,1,2],[1,1,3]].forEach(([dx,dy,qq]) => {
      const cx = x+dx*h/2, cy = y+dy*h/2;
      if (cx+h/2 < 0 || cx-h/2 > W || cy+h/2 < 0 || cy-h/2 > H) return;
      rec(cx,cy,h,depth+1,cell,qq);
    });
  };
  rec(W/2,H/2,S0,0,null,0);
  buildSprite(Math.max(32, Math.round(S0/2**DEPTH*dpr*1.1)));
}
const LOGO_IN_CELL = .84;
function timeline(){ // absolute times of phase B
  const t = {reverse:[0,1.0], grow:[1.0,1.75], arms:[1.45,2.05]};
  let s = 1.95; t.split = SPLIT.slice(0,DEPTH).map(d => {const r=[s,s+d]; s+=d; return r;});
  t.colour = [s-.35, s+.95]; t.fill = [s+.35, s+1.45]; t.fade = [s+1.35, s+1.95]; t.end = s+1.95;
  return t;
}
function drawFractal(tb, tl){
  // which depth is on screen: the deepest level whose split has started
  let level = 0, e = 1;
  tl.split.forEach((r,i) => { if (tb >= r[0]) { level = i+1; e = inOutCubic(seg(tb,r[0],r[1])); } });
  const list = cells.filter(c => c.depth === level);
  const useSprite = list.length > 160;
  const armsIn = level === 0 ? inOutCubic(seg(tb,...tl.arms)) : 1;
  const growE = inOutCubic(seg(tb,...tl.grow));
  for (const c of list) {
    let x = c.x, y = c.y, s = c.s*LOGO_IN_CELL, rot = 0;
    if (level === 0) { s = lerp(T, S0*LOGO_IN_CELL, growE); }
    else if (e < 1) {
      const p = c.parent;
      x = lerp(p.x, c.x, e); y = lerp(p.y, c.y, e); s = lerp(p.s, c.s, e)*LOGO_IN_CELL;
      rot = (c.q===0||c.q===3 ? -90 : 90)*(1-e);
    }
    if (x+s/2 < 0 || x-s/2 > W || y+s/2 < 0 || y-s/2 > H) continue;
    if (useSprite) {
      lctx.setTransform(dpr,0,0,dpr,0,0); lctx.translate(x,y); if (rot) lctx.rotate(rot*Math.PI/180);
      lctx.drawImage(sprite,-s/2,-s/2,s,s);
    } else {
      lctx.setTransform(dpr,0,0,dpr,0,0); drawLogo(lctx, x, y, s, rot, armsIn, 1);
    }
  }
}

/* ================= state & input ================= */
let phase = 'A', target = 0, shown = 0, auto = false, lastInput = 0, tB0 = 0, landedAt = 0, TL = null;
const lens = {x:-999, y:-999, sx:-999, sy:-999, a:0, on:true, speed:0};

function setLocked(v){ root.classList.toggle('locked', v); }
function feed(d){ if (phase !== 'A') return; target = clamp(target+d); lastInput = performance.now(); }
function start(){ phase = 'B'; tB0 = performance.now(); TL = timeline(); }
function land(){ phase = 'L'; landedAt = performance.now(); hero.classList.add('is-open'); canvas.classList.add('is-landed'); setLocked(false); }
function reset(){
  scrollTo(0,0); phase = 'A'; target = shown = 0; auto = false; clickEvents = []; passed = 0;
  hero.classList.remove('is-open'); canvas.classList.remove('is-landed'); setLocked(true);
}

addEventListener('wheel', e => { if (phase==='L') return; e.preventDefault(); feed(e.deltaY*(e.deltaMode===1?18:e.deltaMode===2?innerHeight:1)/900); }, {passive:false});
let touchY = 0;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, {passive:true});
addEventListener('touchmove', e => { if (phase==='L') return; e.preventDefault(); const y=e.touches[0].clientY; feed((touchY-y)/360); touchY=y; }, {passive:false});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('.lab')) return;
  const k = e.key.toLowerCase();
  if (k==='r') { reset(); return; } if (k==='s') { target = shown = 1; start(); return; } if (k==='l') { land(); return; }
  if (k==='h') { document.getElementById('lab').classList.toggle('hidden'); return; }
  if (phase !== 'A') return;
  if (['arrowdown','pagedown',' '].includes(k)) { e.preventDefault(); feed(.2); }
  else if (['arrowup','pageup'].includes(k)) { e.preventDefault(); feed(-.2); }
  else if (k==='enter') { e.preventDefault(); auto = true; }
});
canvas.addEventListener('click', () => { if (phase==='A') { auto = true; lastInput = performance.now(); } });
addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; lens.x = e.clientX; lens.y = e.clientY + scrollY; });
document.getElementById('replay').onclick = reset;
document.getElementById('skip').onclick = () => { target = shown = 1; start(); };
document.getElementById('land').onclick = land;
document.getElementById('hide').onclick = () => document.getElementById('lab').classList.add('hidden');
addEventListener('resize', resize);

/* ================= frame ================= */
let last = performance.now(), frozen = null;
function frame(now){
  if (frozen !== null) { now = frozen; last = now - 16; }
  const dt = Math.min(.05,(now-last)/1000); last = now;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if (phase === 'A') {
    if (auto) target = Math.min(1, target + dt*.55);
    else if (target < 1 && now - lastInput > 900) target = Math.max(0, target - dt*.18);
    shown += (target - shown)*(1 - Math.exp(-dt/.1)); if (target >= 1 && shown > .997) shown = 1;
    // lock clicks at 30 / 60 / 90 %
    const count = CLICKS.filter(c => shown >= c).length;
    while (passed < count) { clickEvents.push({time:now/1000, dir:1}); passed++; }
    while (passed > count) { clickEvents.push({time:now/1000, dir:-1}); passed--; }
    paintDark(); drawTiling(shown, now/1000);
    readout.value = `A · 进度 ${Math.round(shown*100)}% · 转动 ${passed}/3`;
    if (shown >= 1) start();
  }
  else if (phase === 'B') {
    const tb = (now - tB0)/1000, tl = TL;
    paintDark();
    if (tb < tl.reverse[1]) {
      // the film runs backwards: copies fold back to the centre, the turns unwind
      const r = inOutCubic(seg(tb,...tl.reverse));
      drawTiling(1 - r, 0, {turn: 270*(1 - r)});
    } else {
      lctx.setTransform(1,0,0,1,0,0); lctx.clearRect(0,0,layer.width,layer.height); lctx.globalCompositeOperation = 'source-over';
      drawFractal(tb, tl);
      // colour: the painting lands on the tiles, from the centre outward
      const cr = inOutCubic(seg(tb,...tl.colour))*Math.hypot(W,H)*.56;
      if (cr > 0) {
        lctx.save(); lctx.setTransform(1,0,0,1,0,0); lctx.globalCompositeOperation = 'source-atop';
        lctx.beginPath(); lctx.arc(W/2*dpr,H/2*dpr,cr*dpr,0,Math.PI*2); lctx.clip(); lctx.drawImage(comp,0,0); lctx.restore();
      }
      // the gaps fill in behind the tiles
      const fr = inOutCubic(seg(tb,...tl.fill))*Math.hypot(W,H)*.56;
      if (fr > 0) { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.beginPath(); ctx.arc(W/2*dpr,H/2*dpr,fr*dpr,0,Math.PI*2); ctx.clip(); ctx.drawImage(comp,0,0); ctx.restore(); }
      ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1 - inOutCubic(seg(tb,...tl.fade)); ctx.drawImage(layer,0,0); ctx.restore();
      // finally the canvas itself fades and the real hero is underneath
      canvas.style.opacity = String(1 - seg(tb, tl.fade[1]-.25, tl.fade[1]));
      if (tb >= tl.fill[1] - .4) hero.classList.add('is-open');
    }
    readout.value = `B · ${tb.toFixed(2)}s / ${tl.end.toFixed(2)}s`;
    if (tb >= tl.end) { canvas.style.opacity = '1'; land(); }
  }
  else { drawLens(dt); readout.value = '落地 · 移动鼠标试试'; }
  requestAnimationFrame(frame);
}
function paintDark(){
  const g = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.hypot(W,H)*.6);
  g.addColorStop(0,'#121c31'); g.addColorStop(.48,'#080d18'); g.addColorStop(1,'#030408');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}

/* ================= the lens: the painting turns back into TEISU tiles near the pointer ================= */
function drawLens(dt){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height);
  if (!lens.on || scrollY > H) return;
  const k = 1 - Math.exp(-dt/.12);
  const px = lens.sx; lens.sx += (lens.x - lens.sx)*k; lens.sy += (lens.y - lens.sy)*k;
  lens.speed += (Math.hypot(lens.sx - px, 0) / Math.max(dt,.001) - lens.speed)*.08;
  const inside = lens.x > -100 && lens.y < H;
  lens.a += ((inside ? 1 : 0) - lens.a)*(1 - Math.exp(-dt/.25));
  if (lens.a < .01) return;
  const R = (120 + Math.min(80, lens.speed*.06))*lens.a;
  const s = cells.length ? cells.find(c => c.depth === DEPTH)?.s ?? 24 : 24;
  const tile = s*LOGO_IN_CELL, cx = lens.sx, cy = lens.sy;
  // dark gaps inside the lens
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const g = ctx.createRadialGradient(cx,cy,R*.2,cx,cy,R);
  g.addColorStop(0,'rgba(6,9,16,.92)'); g.addColorStop(1,'rgba(6,9,16,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill(); ctx.restore();
  // tiles on the finest grid, turning with distance from the centre of the lens
  lctx.setTransform(1,0,0,1,0,0); lctx.clearRect(0,0,layer.width,layer.height); lctx.globalCompositeOperation = 'source-over';
  const x0 = Math.floor((cx-R - (W/2 - S0/2))/s), x1 = Math.ceil((cx+R - (W/2 - S0/2))/s);
  const y0 = Math.floor((cy-R - (H/2 - S0/2))/s), y1 = Math.ceil((cy+R - (H/2 - S0/2))/s);
  for (let j=y0;j<=y1;j++) for (let i=x0;i<=x1;i++) {
    const x = W/2 - S0/2 + (i+.5)*s, y = H/2 - S0/2 + (j+.5)*s, d = Math.hypot(x-cx,y-cy)/R;
    if (d >= 1) continue;
    const f = 1 - d, size = tile*(.55 + .45*outCubic(f));
    lctx.setTransform(dpr,0,0,dpr,0,0); lctx.translate(x,y); lctx.rotate((1-outCubic(f))*Math.PI/2*((i+j)%2?1:-1));
    lctx.globalAlpha = Math.min(1, f*2.2)*lens.a; lctx.drawImage(sprite,-size/2,-size/2,size,size);
  }
  lctx.globalAlpha = 1; lctx.setTransform(1,0,0,1,0,0); lctx.globalCompositeOperation = 'source-atop'; lctx.drawImage(comp,0,0);
  ctx.drawImage(layer,0,0);
}

/* Snapshot hook for automated checks (lab only). */
window.__lab = {
  a(p){ phase='A'; target=shown=p; clickEvents=[]; passed=CLICKS.filter(c=>p>=c).length; for(let i=0;i<passed;i++) clickEvents.push({time:-99,dir:1}); frozen=performance.now(); },
  b(t){ if(!TL) TL=timeline(); phase='B'; frozen=performance.now(); tB0=frozen-t*1000; hero.classList.toggle('is-open', t>=TL.fill[1]-.4); },
  lens(x,y){ land(); frozen=null; lens.x=lens.sx=x; lens.y=lens.sy=y; lens.a=1; },
  run(){ frozen=null; }, timeline:()=>timeline(),
};
