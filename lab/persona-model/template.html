<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona model · lab</title>
<style>
  :root {--paper:#F3EDE2;--navy:#083366;--red:#EF3025;}
  html,body {margin:0;height:100%;background:var(--paper);overflow:hidden;font:12px/1.4 'Cascadia Code',Consolas,monospace;color:var(--navy);}
  /* the site's ground: paper, a navy slab along the mark's diagonal */
  .ground {position:fixed;inset:0;background:linear-gradient(135deg,transparent 0 58%,var(--navy) 58% 100%);}
  canvas {position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  canvas:active {cursor:grabbing;}
  .hud {position:fixed;left:16px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .hud button {font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--navy);padding:5px 10px;cursor:pointer;}
  .hud button[aria-pressed='true'] {background:var(--navy);color:var(--paper);}
  .tag {position:fixed;left:16px;top:14px;letter-spacing:.16em;text-transform:uppercase;}
  .status {position:fixed;right:16px;top:14px;}
  body.shot .hud,body.shot .tag,body.shot .status {display:none;}
</style>
</head>
<body>
<div class="ground"></div>
<canvas id="stage"></canvas>
<div class="tag">Persona model · lab · step 1 人形</div>
<div class="status" id="status">loading…</div>
<div class="hud">
  <button type="button" data-act="spin" aria-pressed="false">自转</button>
  <button type="button" data-act="front">正面</button>
  <button type="button" data-act="side">侧面</button>
  <button type="button" data-act="back">背面</button>
  <button type="button" data-act="toon" aria-pressed="true">TEISU 色调</button>
</div>
<!-- the model, as a script that runs while the page is parsed, before the module (base-vrm.js, see build.mjs) -->
<script src="./base-vrm.js"></script>
<script type="module" src="./main.ts"></script>
</body>
</html>
